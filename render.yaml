services:
  - type: web
    name: holdwatch
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: KITE_API_KEY
        sync: false
      - key: KITE_API_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: APP_URL
        sync: false
